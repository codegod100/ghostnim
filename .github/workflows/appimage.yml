# Build the AppImage on every push and pull request. Pushes to main also
# publish it to the GitHub release tagged `release` (replacing its assets),
# which is where installed AppImages update from (src/ghostnim/update.nim, or AppImageUpdate via the embedded
# zsync update information).
name: AppImage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  appimage:
    # The oldest supported runner, so the AppImage runs on older glibc too.
    runs-on: ubuntu-22.04
    env:
      OUTPUT: ghostnim-x86_64.AppImage
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libharfbuzz-dev fontconfig

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache libghostty-vt
        uses: actions/cache@v4
        with:
          path: vendor/ghostty-vt
          key: ghostty-vt-${{ runner.os }}-${{ hashFiles('scripts/build-libghostty-vt.sh') }}

      - name: Build AppImage
        env:
          NIM_FLAGS: -d:autoUpdate -d:updateRepo=${{ github.repository }}
          LDAI_UPDATE_INFORMATION: gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|release|ghostnim-x86_64.AppImage.zsync
        run: |
          VERSION="$(sed -n 's/^version *= *"\(.*\)"/\1/p' ghostnim.nimble)+${{ github.run_number }}" \
            sh scripts/build-appimage.sh
          ls -l "$OUTPUT" "$OUTPUT.zsync"

      - name: Smoke test
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 ./"$OUTPUT" --help
          # The binary must run on any x86-64 CPU (the runner's CPU has
          # AVX-512; users' may not, and would get SIGILL). Only Wuffs's
          # *_x86_avx2 functions may use AVX: it calls them after checking
          # the CPU at runtime.
          objdump -d ghostnim | awk '
            /^[0-9a-f]+ <.*>:$/ { fn = $2 }
            /%zmm[0-9]/ || (/%ymm[0-9]/ && fn !~ /^<wuffs_.*_x86_avx2>:$/) { bad[fn]++ }
            END {
              for (f in bad) { print "error: AVX/AVX-512 in " f >"/dev/stderr"; n++ }
              exit (n > 0)
            }'

      - uses: actions/upload-artifact@v4
        with:
          name: ghostnim-appimage
          path: |
            ${{ env.OUTPUT }}
            ${{ env.OUTPUT }}.zsync

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A single release under the fixed `release` tag: move the tag to
          # this commit and replace the assets, so the download URLs never
          # change.
          tag=release
          title="ghostnim $(date -u +%Y-%m-%d) #${{ github.run_number }} (${GITHUB_SHA::7})"
          notes="Automated build of ${GITHUB_SHA::7}. Installed AppImages update to this release on their own."
          git tag -f "$tag" "$GITHUB_SHA"
          git push -f origin "refs/tags/$tag"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$OUTPUT" "$OUTPUT.zsync" --clobber
            gh release edit "$tag" --title "$title" --notes "$notes" --latest
          else
            gh release create "$tag" "$OUTPUT" "$OUTPUT.zsync" \
              --verify-tag --title "$title" --notes "$notes" --latest
          fi

      - name: Remove versioned releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Earlier builds were published as one release per build
          # (build-YYYYMMDD-N); delete them along with their tags.
          gh release list --limit 1000 --json tagName --jq '.[].tagName' |
            grep -v '^release$' |
            xargs -r -n1 gh release delete --cleanup-tag --yes
