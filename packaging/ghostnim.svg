<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2540"/>
      <stop offset="1" stop-color="#15131f"/>
    </linearGradient>
    <linearGradient id="ghost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9dcef"/>
    </linearGradient>
    <linearGradient id="crown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#f3b21b"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="51.5" fill="none"
        stroke="#ffffff" stroke-opacity=".08"/>

  <!-- ghost -->
  <path d="M128 62c-40 0-66 30-66 70v84
           q11 -14 22 0 q11 14 22 0 q11 -14 22 0 q11 14 22 0 q11 -14 22 0 q11 14 22 0
           v-84c0-40-26-70-66-70z"
        fill="url(#ghost)"/>

  <!-- face: a terminal prompt -->
  <path d="M90 124l22 16-22 16" fill="none" stroke="#1b1828" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="122" y="150" width="40" height="12" rx="6" fill="#1b1828"/>

  <!-- Nim crown, tipped jauntily -->
  <g transform="translate(-4 14) rotate(-12 150 58)">
    <path d="M112 76l-6-38 22 18 22-26 22 26 22-18-6 38z"
          fill="url(#crown)" stroke="#b77d06" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="106" cy="38" r="5" fill="#ffe27a"/>
    <circle cx="150" cy="30" r="5" fill="#ffe27a"/>
    <circle cx="194" cy="38" r="5" fill="#ffe27a"/>
  </g>
</svg>
